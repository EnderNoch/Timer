<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Prosty timer</title>
<style>
/* OpenDyslexic z systemu (Font Book) - wszystkie odmiany */
@font-face{font-family:'AppFont';font-weight:400;font-style:normal;font-display:swap;
  src:local('OpenDyslexic Regular'),local('OpenDyslexic-Regular'),local('OpenDyslexic')}
@font-face{font-family:'AppFont';font-weight:700;font-style:normal;font-display:swap;
  src:local('OpenDyslexic Bold'),local('OpenDyslexic-Bold')}
@font-face{font-family:'AppFont';font-weight:400;font-style:italic;font-display:swap;
  src:local('OpenDyslexic Italic'),local('OpenDyslexic-Italic')}
@font-face{font-family:'AppFont';font-weight:700;font-style:italic;font-display:swap;
  src:local('OpenDyslexic Bold Italic'),local('OpenDyslexic-BoldItalic')}
@font-face{font-family:'AppMono';font-weight:400;font-style:normal;font-display:swap;
  src:local('OpenDyslexicMono'),local('OpenDyslexicMono-Regular'),local('OpenDyslexicMono Regular'),local('SF Mono')}
html[data-font="dys"],html[data-font="dys"] body,html[data-font="dys"] .tw,
html[data-font="dys"] input,html[data-font="dys"] button,html[data-font="dys"] select{
  font-family:'AppFont','OpenDyslexic',-apple-system,BlinkMacSystemFont,sans-serif}
html[data-font="dys"] #tw-time{font-family:'AppMono','AppFont','OpenDyslexic',ui-monospace,'SF Mono',monospace}
html[data-font="sys"],html[data-font="sys"] body,html[data-font="sys"] .tw,
html[data-font="sys"] input,html[data-font="sys"] button,html[data-font="sys"] select{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif}
html[data-font="sys"] #tw-time{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
</style>
<style>
:root,html[data-theme="dark"]{
  --bg:#1A1A19;--fg:#FFFFFF;--muted:#C9C7C0;--line:rgba(255,255,255,0.4);
  --hover:rgba(122,69,201,0.35);--active:rgba(122,69,201,0.55);
  --focus:rgba(163,124,255,0.55);--focusline:#B79CFF;--hoverline:#A47BE8;
  --face:#2B2140;--ring:#9B72F0;--ringpause:#7A45C9;--track:rgba(255,255,255,0.16);
  --danger:#FF7B7B;--dangersoft:rgba(255,155,155,0.18);
  --ghost:rgba(255,255,255,0.274);--icon:#C4A9FF;--title:#E6DBFF;--glow:rgba(155,114,240,0.55);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#F5F2FA;--fg:#1B1526;--muted:#5B5370;--line:rgba(60,40,100,0.35);
  --hover:rgba(122,69,201,0.14);--active:rgba(122,69,201,0.24);
  --focus:rgba(107,79,191,0.45);--focusline:#6B4FBF;--hoverline:#8A6BD8;
  --face:#E8DFF8;--ring:#6B4FBF;--ringpause:#9B87D8;--track:rgba(60,40,100,0.16);
  --danger:#C0392B;--dangersoft:rgba(192,57,43,0.14);
  --ghost:rgba(60,40,100,0.32);--icon:#6B4FBF;--title:#3B2A6B;--glow:rgba(107,79,191,0.25);
  color-scheme:light;
}
@media (prefers-color-scheme:light){
  html[data-theme="auto"]{
    --bg:#F5F2FA;--fg:#1B1526;--muted:#5B5370;--line:rgba(60,40,100,0.35);
    --hover:rgba(122,69,201,0.14);--active:rgba(122,69,201,0.24);
    --focus:rgba(107,79,191,0.45);--focusline:#6B4FBF;--hoverline:#8A6BD8;
    --face:#E8DFF8;--ring:#6B4FBF;--ringpause:#9B87D8;--track:rgba(60,40,100,0.16);
    --danger:#C0392B;--dangersoft:rgba(192,57,43,0.14);
    --ghost:rgba(60,40,100,0.32);--icon:#6B4FBF;--title:#3B2A6B;--glow:rgba(107,79,191,0.25);
    color-scheme:light;
  }
}
html,body{background:var(--bg);color:var(--fg);margin:0;padding:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
::selection{background:var(--ring);color:var(--bg)}
.tw{--g:8px;--full:clamp(272px,26vw,400px);--w:calc((var(--full) - var(--g)) / 2);--h:clamp(38px,4.4vh,54px);--fs:clamp(14px,0.95vw,19px);--dial:clamp(240px,min(58vh,40vw),620px);--digits:calc(var(--dial) * 0.145);display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.2vh,26px);padding:24px 16px;margin:auto;max-height:100vh;overflow:hidden;color:var(--fg);box-sizing:border-box}
.tw-left,.tw-right{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.8vh,22px);min-height:0}
.tw-dial{position:relative;width:var(--dial);height:var(--dial);flex:0 0 auto}
.tw-dial svg{width:var(--dial);height:var(--dial);transform:rotate(-90deg)}
.tw-dial-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--digits) * 0.12)}
#tw-time{font-size:var(--digits);font-weight:500;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1.1}
#tw-state{font-size:calc(var(--digits) * 0.32);color:var(--muted)}
@media (min-width:820px) and (min-height:430px){
  .tw{flex-direction:row;align-items:center;gap:clamp(36px,7vw,140px)}
  .tw-right{max-height:calc(100vh - 48px)}
}
.tw input,.tw button,.tw select{font-family:inherit}
.tw button,.tw-field,.tw select{box-sizing:border-box;height:var(--h);width:var(--w);padding:0 12px;border:1px solid var(--line);border-radius:8px;background-color:transparent;color:var(--fg);font-size:var(--fs);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background 0.12s,border-color 0.12s;overflow:hidden;white-space:nowrap}
.tw button:hover,.tw-field:hover,.tw select:hover{background-color:var(--hover);border-color:var(--hoverline)}
.tw button:focus-visible,.tw-field:focus-within,.tw select:focus-visible{outline:none;border-color:var(--focusline);box-shadow:0 0 0 2px var(--focus)}
.tw button:active{background-color:var(--active)}
.tw-row{display:flex;gap:var(--g);flex-wrap:wrap;justify-content:center;align-items:center;width:var(--full)}
.tw button.tw-full{width:var(--full)}
.tw select{width:var(--full);font-size:var(--fs);text-align:center;text-align-last:center}
.tw select#tw-theme,.tw select#tw-font{width:var(--w)}
.tw select option{background:var(--bg);color:var(--fg)}
.tw button.tw-icon{width:var(--h);padding:0;flex:0 0 auto}
#tw-test{min-width:0}
.tw button[hidden]{display:none}
.tw select[hidden]{display:none}
.tw-row[hidden]{display:none}
.tw-row.tw-sound{flex-wrap:nowrap}
.tw-off{opacity:0.45;pointer-events:none}
#tw-test{flex:1 1 auto;width:auto;min-width:0}
.tw-third{width:calc((var(--full) - 2 * var(--g)) / 3);padding:0 2px 0 8px;justify-content:space-between}
.tw button.tw-pre{justify-content:space-between;padding:0 6px 0 12px;gap:4px}
.tw-pre span:first-child{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis}
.tw-pre .x{opacity:0.6;flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--fg)}
.tw-pre .x:hover{opacity:1;color:var(--danger);background:var(--dangersoft)}
.tw select,#tw-add{}
#tw-add{border-style:dashed}
#tw-testicon{display:flex;align-items:center;justify-content:center;width:14px;height:14px;flex:0 0 auto;color:var(--icon)}
#tw-testicon svg{display:block}
#tw-presets{width:calc(var(--full) + 16px);overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;align-content:flex-start;min-height:0;flex:0 1 auto;scrollbar-width:thin;scrollbar-color:var(--ring) transparent}
#tw-presets::-webkit-scrollbar{width:6px}
#tw-presets::-webkit-scrollbar-thumb{background:var(--ring);border-radius:3px}
.tw-ghost{box-sizing:border-box;width:var(--w);height:var(--h);border:1px dashed var(--ghost);border-radius:8px;pointer-events:none}
.tw-lab{font-size:calc(var(--fs) * 0.85);color:var(--muted);text-align:center;margin-top:5px}
.tw-title{width:var(--full);display:flex;align-items:center;gap:12px;box-sizing:border-box}
.tw-title::before,.tw-title::after{content:"";flex:1;height:1px;background:var(--line)}
.tw-title span{font-size:calc(var(--fs) * 1.1);letter-spacing:0.2em;text-transform:uppercase;color:var(--title);text-shadow:0 0 14px var(--glow);white-space:nowrap;padding-left:0.2em}
.tw-field input{flex:1;min-width:0;width:100%;padding:0;margin:0;border:0;background:transparent;color:var(--fg);font-size:calc(var(--fs) * 1.15);text-align:center;caret-color:var(--focusline);-moz-appearance:textfield;appearance:textfield}
.tw-field input:focus{outline:none}
.tw-field input::-webkit-outer-spin-button,.tw-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tw-spin{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.tw-spin button{height:calc(var(--h) * 0.4);width:22px;padding:0;border:0;border-radius:4px;opacity:0.6;gap:0}
.tw-spin button:hover{opacity:1;background:var(--hover);border:0}
</style>
<style>
/* ---------- Liquid Glass (macOS 26) ----------------------------------
   Tafla szkła to: wypełnienie + rozmycie tego, co pod spodem + refleks na
   górnej krawędzi + cienki rant + miękki cień. Kształt kapsuły — tak Apple
   rysuje dziś przyciski.

   W aplikacji (data-glass="1") tło strony znika, bo prawdziwe szkło rysuje
   pod WKWebView systemowy NSGlassEffectView. W przeglądarce tło zostaje,
   a rozmycie ma co brać z poświaty malowanej przez body::before.
   -------------------------------------------------------------------- */
:root,html[data-theme="dark"]{
  /* --tint: suwak Liquid Glass z systemu (macOS 27), 0 przejrzyste,
     1 zabarwione. Ustawia go aplikacja przez window.__glass;
     w przeglądarce zostaje 0, czyli tak jak było. */
  --tint:0;
  --glass:rgba(255,255,255,calc(0.10 + 0.22 * var(--tint)));
  --glass-strong:rgba(255,255,255,calc(0.15 + 0.25 * var(--tint)));
  --rim:rgba(255,255,255,calc(0.18 + 0.14 * var(--tint)));--spec:rgba(255,255,255,0.42);
  --shade:0 1px 2px rgba(0,0,0,0.18);
  --dialface:rgba(43,33,64,0.46);
  --blob-a:rgba(122,69,201,0.45);--blob-b:rgba(56,120,210,0.28);
  --legible:0 1px 14px rgba(0,0,0,0.45);
  --blur:22px;
  /* znaczek listy rozwijanej: podkladka + dwa daszki, jak w macOS 26 */
  --chev:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='6' fill='%23ffffff' fill-opacity='.16'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='.9' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7.6 9.3 11 6l3.4 3.3'/%3E%3Cpath d='M7.6 12.7 11 16l3.4-3.3'/%3E%3C/g%3E%3C/svg%3E");
  /* promien kontrolek: 999px to kapsula, ~10px to zaokraglony prostokat */
  --r:999px;
  /* znaczek listy rozwijanej: podkladka + dwa daszki, jak w macOS 26 */
}
html[data-theme="light"]{
  --glass:rgba(255,255,255,calc(0.52 + 0.30 * var(--tint)));
  --glass-strong:rgba(255,255,255,calc(0.64 + 0.24 * var(--tint)));
  --rim:rgba(255,255,255,0.85);--spec:rgba(255,255,255,1);
  --shade:0 1px 2px rgba(60,40,100,0.12);
  --dialface:rgba(255,255,255,0.55);
  --blob-a:rgba(140,110,230,0.30);--blob-b:rgba(120,180,235,0.26);
  --legible:0 1px 12px rgba(255,255,255,0.75);
  --chev:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='6' fill='%231B1526' fill-opacity='.12'/%3E%3Cg fill='none' stroke='%231B1526' stroke-opacity='.85' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7.6 9.3 11 6l3.4 3.3'/%3E%3Cpath d='M7.6 12.7 11 16l3.4-3.3'/%3E%3C/g%3E%3C/svg%3E");
}
@media (prefers-color-scheme:light){
  html[data-theme="auto"]{
    --glass:rgba(255,255,255,calc(0.52 + 0.30 * var(--tint)));
    --glass-strong:rgba(255,255,255,calc(0.64 + 0.24 * var(--tint)));
    --rim:rgba(255,255,255,0.85);--spec:rgba(255,255,255,1);
    --shade:0 1px 2px rgba(60,40,100,0.12);
    --dialface:rgba(255,255,255,0.55);
    --blob-a:rgba(140,110,230,0.30);--blob-b:rgba(120,180,235,0.26);
    --legible:0 1px 12px rgba(255,255,255,0.75);
  --chev:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='6' fill='%231B1526' fill-opacity='.12'/%3E%3Cg fill='none' stroke='%231B1526' stroke-opacity='.85' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7.6 9.3 11 6l3.4 3.3'/%3E%3Cpath d='M7.6 12.7 11 16l3.4-3.3'/%3E%3C/g%3E%3C/svg%3E");
  }
}

/* poświata pod szkłem: bez niej rozmycie nie miałoby czego rozmywać */
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 38% at 22% 26%,var(--blob-a),transparent 68%),
    radial-gradient(34% 34% at 24% 86%,var(--blob-b),transparent 70%);
  filter:blur(50px)}

/* przyciski, pola i listy: kapsuły ze szkła */
.tw button,.tw-field,.tw select{
  border:0;border-radius:var(--r);
  background-color:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim),var(--shade);
  transition:background-color 0.18s ease,box-shadow 0.18s ease,transform 0.1s ease}
.tw button:hover,.tw-field:hover,.tw select:hover{
  background-color:var(--hover);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--hoverline),var(--shade)}
.tw button:active{background-color:var(--active);transform:scale(0.97)}
.tw button:focus-visible,.tw-field:focus-within,.tw select:focus-visible{
  outline:none;
  box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--focusline),
             0 0 0 3px var(--focus),var(--shade)}

/* Menu systemowe macOS otwiera się 13 px na lewo od kontrolki — to stała
   w silniku i strona nie ma jak jej ruszyć. Więc kapsułę rysuje otoczka,
   a samo <select> siedzi w niej przezroczyste i przesunięte o 13 px w prawo:
   system odejmuje swoje 13 px od przesuniętej listy i menu wypada dokładnie
   na kapsule. Otoczka tnie to, co przez przesunięcie wystaje w prawo. */
.tw-sel{
  --shift:13px;
  /* Menu przykleja się górą do górnej krawędzi listy, zamiast wyśrodkować
     się na niej. Pozycja w menu ma około 33 px, więc lista musi zjechać
     o połowę różnicy między własną wysokością a tymi 33 px. */
  --vshift:calc((var(--h) - 33px) / 2);
  position:relative;box-sizing:border-box;
  display:inline-flex;align-items:center;
  height:var(--h);width:var(--full);
  border-radius:10px;overflow:hidden;cursor:pointer;
  background-color:var(--glass);
  background-image:var(--chev);
  background-repeat:no-repeat;
  background-position:right 7px center;
  background-size:22px 22px;
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim),var(--shade);
  transition:background-color 0.18s ease,box-shadow 0.18s ease}
.tw-sel:hover{
  background-color:var(--hover);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--hoverline),var(--shade)}
.tw-sel-half{width:var(--w);background-position:right 5px center;background-size:18px 18px}
.tw-sel[hidden]{display:none}

/* Napis listy trafia tam, gdzie napis w otwartym menu (13 px przesunięcia
   plus szerokość kolumny na ptaszek). Prawe dopełnienie ma o te 13 px
   więcej, bo prawa krawędź listy leży poza kapsułą. */
.tw .tw-sel select{
  position:absolute;top:var(--vshift);left:var(--shift);
  width:100%;height:100%;margin:0;
  -webkit-appearance:none;appearance:none;
  text-align:left;text-align-last:left;
  /* Lista zjechała w dół, więc napis pojechał razem z nią. Dopełnienie od
     dołu, dwa razy zjazd, ścieśnia pole tekstu od spodu i wypycha napis
     z powrotem na środek kapsuły. Menu tego nie dotyczy — ono liczy się
     z ramki listy, a ta zostaje przesunięta. */
  padding:0 43px calc(var(--vshift) * 2) 14px;
  border:0;border-radius:0;
  background:transparent;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none}
.tw .tw-sel-half select{padding:0 36px calc(var(--vshift) * 2) 14px}
.tw .tw-sel select:hover,.tw .tw-sel select:focus,.tw .tw-sel select:focus-visible{
  background:transparent;box-shadow:none;outline:none}

/* „+ zapisz czas” zostaje przerywany — rant kreską zamiast obramowania */
#tw-add{background:transparent;box-shadow:none;
  outline:1px dashed var(--ghost);outline-offset:-1px}
#tw-add:hover{background:var(--hover);box-shadow:none;outline-color:var(--hoverline)}

/* krzyżyk presetu siedział na łuku kapsuły — odsuwam go od krawędzi */
.tw button.tw-pre{padding-right:11px}
.tw-pre .x{width:22px;height:22px;border-radius:7px}
.tw-ghost{border-radius:var(--r)}

/* strzałki w polach czasu i krzyżyk presetu siedzą już na szkle pola */
.tw-spin button,.tw-spin button:hover{
  background:transparent;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none}
.tw-spin button:hover{background:var(--hover)}
.tw-pre .x{border-radius:999px}

/* Niskie okno: lewa kolumna nie kurczy się poniżej tarczy (tarcza wychodziła
   poza nią i lądowała na polach czasu), a gdy treść się nie mieści, całość
   się przewija zamiast nachodzić */
.tw-left{flex:0 0 auto}

/* Wąskie okno: kolumna kontrolek brała 26vw, więc przy 419 px opadała na
   swoje minimum 272 px i marnowała ~100 px, które okno miało. Napis
   „OpenDyslexic” potrzebuje 171 px, a dostawał 132. Teraz bierze tyle,
   ile okno daje — nadal nie więcej niż 400 px. Odjęte 48 px to boczne
   dopełnienie .tw plus zapas na pasek przewijania listy presetów. */
.tw{--full:clamp(272px,calc(100vw - 48px),400px);overflow-x:hidden;overflow-y:auto}

/* Odstęp między tarczą a kontrolkami: 7vw dawało 118 px na szerokim ekranie */
@media (min-width:820px) and (min-height:430px){
  .tw{gap:clamp(28px,4vw,72px)}
}

/* tarcza: szklany krążek pod pierścieniem */
.tw-dial svg{position:relative;z-index:1}
.tw-dial-text{z-index:2}
.tw-dial-glass{position:absolute;left:7.3%;top:7.3%;width:85.4%;height:85.4%;
  border-radius:50%;z-index:0;pointer-events:none;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 2px 0 var(--spec),inset 0 0 0 1px var(--rim),
             inset 0 -24px 48px rgba(0,0,0,0.10),0 10px 30px rgba(0,0,0,0.18)}
.tw-dial svg circle:first-of-type{fill:var(--dialface)}
#tw-arc{filter:drop-shadow(0 0 8px var(--glow))}

/* okno aplikacji ze szkłem: strona schodzi z drogi, zostaje sam tekst */
html[data-glass="1"],html[data-glass="1"] body{background:transparent}
html[data-glass="1"] body::before{display:none}
html[data-glass="1"] #tw-time,html[data-glass="1"] #tw-state,
html[data-glass="1"] .tw-lab{text-shadow:var(--legible)}
</style>
</head>
<body>
<div class="tw">
 <div class="tw-left">
  <div class="tw-title"><span id="tw-title-text">Prosty timer</span></div>

  <div class="tw-dial">
    <div class="tw-dial-glass" aria-hidden="true"></div>
    <svg viewBox="0 0 260 260">

    readColors();lastIcon='';
  }
  function paintMute(){
    var mb=$('tw-mute');
    var live=(mode==='over'&&beepTimer);
    $('tw-test').disabled=live;
    $('tw-test').style.opacity=live?'0.4':'';
    $('tw-test').style.pointerEvents=live?'none':'';
    if(mode!=='idle'){
      $('tw-add').hidden=true;mb.hidden=false;
      mb.innerHTML='';
      var ic=document.createElement('span');
      ic.style.cssText='display:flex;align-items:center;justify-content:center;width:15px;height:15px;flex:0 0 auto';
      ic.innerHTML=muted?PLAY:MUTE;
      var tx=document.createElement('span');
      tx.textContent=muted?T.muteOff:T.muteOn;
      mb.appendChild(ic);mb.appendChild(tx);
    }else{
      $('tw-add').hidden=false;mb.hidden=true;
    }
  }
  var folderFiles=[];
  function buildList(){
    var sel=$('tw-list');
    sel.innerHTML='';
    if(!folderFiles.length){$('tw-list-row').hidden=true;return}
    folderFiles.forEach(function(f,i){
      var o=document.createElement('option');
      o.value=String(i);o.textContent=f.name.replace(/\.[^.]+$/,'');
      sel.appendChild(o);
    });
    $('tw-list-row').hidden=false;
    sel.selectedIndex=-1;
  }
  function useFile(f,persist){
    var r=new FileReader();
    r.onload=function(){
      var buf=r.result;
      if(persist&&f.size<3000000){
        var fr=new FileReader();
        fr.onload=function(){loadArrayBuffer(buf,f.name,fr.result,true)};
        fr.readAsDataURL(f);
      }else{
        loadArrayBuffer(buf,f.name,null,false);
      }
    };
    r.readAsArrayBuffer(f);
  }
  function markCustom(){
    $('tw-default').hidden=!(customBuf||customName);
  }
  function loadArrayBuffer(buf,name,b64,persist){
    var a=ctx();
    a.decodeAudioData(buf.slice(0),function(decoded){
      customBuf=decoded;customName=name||'';
      if(persist&&b64){
        try{localStorage.setItem(AKEY,JSON.stringify({n:customName,d:b64}))}catch(e){}
      }
      markCustom();
    },function(){markCustom()});
  }
  function loadStored(){
    try{
      var raw=localStorage.getItem(AKEY);if(!raw)return;
      var d=JSON.parse(raw);if(!d||!d.d)return;
      customB64=d.d;customName=d.n||'';
      var bin=atob(d.d.split(',').pop()),len=bin.length,arr=new Uint8Array(len);
      for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
      loadArrayBuffer(arr.buffer,customName,null,false);
    }catch(e){}
  }
  function detectLang(){
    var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
    for(var i=0;i<list.length;i++){
      var code=list[i]; if(!code)continue;
      if(LANGS[code])return code;
      var low=code.toLowerCase();
      if(low.indexOf('zh')===0){
        if(low.indexOf('hant')>-1||low.indexOf('tw')>-1||low.indexOf('hk')>-1||low.indexOf('mo')>-1)return 'zh-Hant';
        return 'zh-Hans';
      }
      if(low.indexOf('no')===0||low.indexOf('nn')===0)return 'nb';
      var base=low.split('-')[0];
      if(LANGS[base])return base;
    }
    return 'en';
  }
  function activeLang(){return langPref==='auto'?detectLang():(LANGS[langPref]?langPref:'en')}
  function buildLangList(){
    var sel=$('tw-lang');
    var codes=Object.keys(LANGS).sort(function(a,b){return LANGS[a].n.localeCompare(LANGS[b].n)});
    sel.innerHTML='';
    var auto=document.createElement('option');
    auto.value='auto';auto.textContent='Auto \u2014 '+LANGS[detectLang()].n;
    sel.appendChild(auto);
    codes.forEach(function(c){
      var o=document.createElement('option');
      o.value=c;o.textContent=LANGS[c].n;
      sel.appendChild(o);
    });
    sel.value=langPref;
  }
  function applyLang(){
    T=LANGS[activeLang()];
    document.documentElement.lang=activeLang();
    document.documentElement.dir=T.rtl?'rtl':'ltr';
    $('tw-title-text').textContent=T.t;
    $('tw-lab-h').textContent=T.h;
    $('tw-lab-m').textContent=T.m;
    $('tw-lab-s').textContent=T.s;
    $('tw-add').textContent=T.save;
    $('tw-reset').textContent=T.reset;
    if(mode==='idle'){main.textContent=T.start}
    else if(mode==='running'){main.textContent=T.pauseBtn}
    else if(mode==='paused'){main.textContent=T.resume}
    else{main.textContent=T.stopBtn}
    tLabel.textContent=testing?T.stopSnd:T.listen;
    paintMute();
    drawPresets();
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);if(!raw)return;
      var d=JSON.parse(raw);
      if(typeof d.total==='number'&&d.total>0)total=d.total;
      if(Array.isArray(d.presets))presets=d.presets;
      if(d.lang)langPref=d.lang;
      if(d.theme)themePref=d.theme;
      if(d.font)fontPref=d.font;
    }catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify({total:total,presets:presets,lang:langPref,theme:themePref,font:fontPref}))}catch(e){}}

  function fmt(ms){
    var neg=ms<0,t=Math.floor((Math.abs(ms)+(neg?999:0))/1000);
    var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=function(n){return n<10?'0'+n:''+n};
    return (neg?'-':'')+(h>0?h+':'+p(m)+':'+p(s):p(m)+':'+p(s));
  }
  function inputsSec(){
    var h=parseInt($('tw-h').value||0,10),m=parseInt($('tw-m').value||0,10),s=parseInt($('tw-s').value||0,10);
    return Math.max(0,(h||0)*3600+(m||0)*60+(s||0));
  }
  function setInputs(sec){$('tw-h').value=Math.floor(sec/3600);$('tw-m').value=Math.floor(sec%3600/60);$('tw-s').value=sec%60}

  function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
  function tone(f,at,dur,vol){
    var a=ctx(),o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+at;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.05);
    nodes.push([o,g]);
    o.onended=function(){for(var i=0;i<nodes.length;i++){if(nodes[i][0]===o){nodes.splice(i,1);break}}};
  }
  function hit(f,at,dur,vol){
    tone(f,at,dur,vol);
    tone(f*2,at,dur*0.4,vol*0.3);
    tone(f*4.1,at,0.09,vol*0.12);
  }
  function playBuffer(){
    var a=ctx(),src=a.createBufferSource(),g=a.createGain();
    src.buffer=customBuf;g.gain.value=1;
    src.connect(g);g.connect(a.destination);src.start();
    nodes.push([src,g]);
    src.onended=function(){for(var i=0;i<nodes.length;i++){if(nodes[i][0]===src){nodes.splice(i,1);break}}};
  }
  function alarmLen(){return customBuf?Math.round(customBuf.duration*1000):PHRASE}
  function alarmGap(){return customBuf?Math.round(customBuf.duration*1000)+800:REPEAT}
  function alarm(){
    if(window.__native)return;
    if(customBuf){try{playBuffer()}catch(e){}return}
    try{
      var S=0.17;
      var N={c5:523.25,d5:587.33,e5:659.25,g5:783.99,a5:880,c6:1046.5,d6:1174.66,e6:1318.51,c3:130.81,g2:98,a2:110};
      var mel=[
        [0,N.c5],[1,N.e5],[2,N.g5],[3,N.e5],[4,N.a5],[5,N.g5],[6,N.e5],
        [8,N.g5],[9,N.a5],[10,N.c6],[11,N.a5],[12,N.g5],[13,N.e5],[14,N.d5],
        [16,N.c6],[17,N.d6],[18,N.e6],[20,N.c6],[22,N.g5],
        [24,N.e5],[26,N.c5]
      ];
      mel.forEach(function(n,i){hit(n[1],n[0]*S,0.6,0.19-(i%2?0.03:0))});
      [[0,N.c3],[8,N.a2],[16,N.g2],[24,N.c3]].forEach(function(b){tone(b[1],b[0]*S,1.1,0.13)});
      tone(N.c5,26*S,1.8,0.1);
      tone(N.g5,26*S,1.4,0.05);
    }catch(e){}
  }
  function silence(){
    try{
      var now=ac?ac.currentTime:0;
      nodes.forEach(function(n){
        try{
          n[1].gain.cancelScheduledValues(now);
          n[1].gain.setValueAtTime(Math.max(n[1].gain.value,0.0001),now);
          n[1].gain.exponentialRampToValueAtTime(0.0001,now+0.05);
          n[0].stop(now+0.08);
        }catch(e){}
      });
      nodes=[];
    }catch(e){}
  }
  function endTest(){
    testing=false;
    if(testTimer){clearTimeout(testTimer);testTimer=null}
    idleAudio();
    tIcon.innerHTML=PLAY;tLabel.textContent=T.listen;
  }
  function stopBeeps(){if(beepTimer){clearInterval(beepTimer);beepTimer=null}}
  function idleAudio(){
    setTimeout(function(){
      try{
        if(ac&&!beepTimer&&!testing){
          var old=ac;ac=null;nodes=[];
          if(old.close)old.close();else old.suspend();
        }
      }catch(e){}
    },250);
  }

  var pickPending=false;
  function paint(left){
    var txt=fmt(left);
    tEl.textContent=txt;
    if(left<0){
      tEl.style.color=OVER;
      arc.setAttribute('stroke',OVER);
      arc.setAttribute('stroke-dashoffset','0');
      sEl.textContent=T.over;
      icon('over',1);
      if(!pickPending){
        var sel=$('tw-list'),si=(sel&&!$('tw-list-row').hidden)?sel.selectedIndex:-1;
        chan(txt+' '+T.over+' |O'+(beepTimer?'':' |M')+' |S'+si);
      }
    }else{
      tEl.style.color=FG;
      arc.setAttribute('stroke',mode==='paused'?PAUSE:RUN);
      var frac=total>0?left/(total*1000):0;
      arc.setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(1));
      sEl.textContent=mode==='running'?T.run:(mode==='paused'?T.pause:T.ready);
      if(mode==='idle'){
        icon('idle',0);
        if(!pickPending)chan(T.t+' |L'+total+(presets.length?','+presets.join(','):''));
      }
      else{icon(mode,frac);if(!pickPending)chan(txt+(mode==='paused'?' |P':''))}
    }
  }
  function loop(){
    var left=endAt-Date.now();
    if(mode==='running'&&left<=0){
      mode='over';main.textContent=T.stopBtn;
      if(!muted){alarm();beepTimer=setInterval(alarm,alarmGap())}
      paintMute();
    }
    paint(left);
  }
  function start(){
    silence();endTest();
    if(mode==='idle'){total=inputsSec();if(total<=0)return;save();endAt=Date.now()+total*1000}
    else if(mode==='paused'){endAt=Date.now()+leftPaused}
    ctx();
    try{ac.suspend()}catch(e){}
    mode='running';setup.classList.add('tw-off');pbox.classList.add('tw-off');
    main.textContent=T.pauseBtn;paintMute();
    if(tick)clearInterval(tick);tick=setInterval(loop,100);loop();
  }
  function pause(){leftPaused=endAt-Date.now();idleAudio();mode='paused';main.textContent=T.resume;clearInterval(tick);tick=null;paint(leftPaused)}
  function reset(){
    clearInterval(tick);tick=null;stopBeeps();silence();endTest();idleAudio();mode='idle';
    setup.classList.remove('tw-off');pbox.classList.remove('tw-off');
    main.textContent=T.start;muted=false;paintMute();setInputs(total);paint(total*1000);
  }
  main.addEventListener('click',function(){
    if(mode==='running')pause();
    else if(mode==='over'){stopBeeps();silence();reset()}
    else start();
  });
  $('tw-reset').addEventListener('click',reset);
  test.addEventListener('click',function(){
    if(window.__native){
      if(testing){pickPending=true;chan('__STOP__');endTest();
        setTimeout(function(){pickPending=false;paint(mode==='idle'?total*1000:(endAt-Date.now()))},600);
        return}
      var sel=$('tw-list'),si=(sel&&!$('tw-list-row').hidden)?sel.selectedIndex:-1;
      pickPending=true;chan('__PLAY__ |T'+Date.now()+' |S'+si);
      testing=true;tIcon.innerHTML=STOP;tLabel.textContent=T.stopSnd;
      setTimeout(function(){
        pickPending=false;
        paint(mode==='idle'?total*1000:(endAt-Date.now()));
      },600);
      return;
    }
    if(testing){silence();endTest();return}
    ctx();alarm();testing=true;
    tIcon.innerHTML=STOP;tLabel.textContent=T.stopSnd;
    testTimer=setTimeout(endTest,alarmLen());
  });
  setup.addEventListener('click',function(e){
    var b=e.target.closest('.tw-spin button');if(!b)return;
    var el=$(b.dataset.t),d=parseInt(b.dataset.d,10);
    var max=parseInt(el.max,10),v=parseInt(el.value||0,10)+d;
    if(v<0)v=max; if(v>max)v=0;
    el.value=v;total=inputsSec();paint(total*1000);save();
  });
  $('tw-add').addEventListener('click',function(){
    var sec=(mode==='idle')?inputsSec():total;
    if(sec>0&&presets.indexOf(sec)===-1){presets.push(sec);presets.sort(function(a,b){return a-b});save();drawPresets();paint(mode==='idle'?total*1000:(endAt-Date.now()))}
  });
  pbox.addEventListener('click',function(e){
    var xhit=e.target.closest('.x');
    if(xhit){
      var v=parseInt(xhit.parentNode.dataset.sec,10);
      presets=presets.filter(function(p){return p!==v});save();drawPresets();paint(mode==='idle'?total*1000:(endAt-Date.now()));
      return;
    }
    var b=e.target.closest('.tw-pre');if(!b||!b.dataset.sec)return;
    total=parseInt(b.dataset.sec,10);setInputs(total);paint(total*1000);save();
  });
  ['tw-h','tw-m','tw-s'].forEach(function(id){$(id).addEventListener('input',function(){total=inputsSec();paint(total*1000);save()})});
  $('tw-lang').addEventListener('change',function(){
    langPref=this.value;save();applyLang();paint(mode==='idle'?total*1000:(endAt-Date.now()));
  });
  $('tw-mute').addEventListener('click',function(){
    muted=!muted;
    if(muted){stopBeeps();silence();idleAudio()}
    else if(mode==='over'){ctx();alarm();beepTimer=setInterval(alarm,alarmGap())}
    paintMute();
  });
  $('tw-list').addEventListener('change',function(){
    var f=folderFiles[parseInt(this.value,10)];
    if(!f)return;
    silence();endTest();
    if(f.native){customBuf=null;customName=f.name;markCustom();return}
    if(f.buf){customBuf=f.buf;customName=f.name;markCustom()}
    else useFile(f,true);
  });
  $('tw-default').addEventListener('click',function(){
    if(!window.confirm(T.askDefault))return;
    silence();endTest();customBuf=null;customName='';
    try{localStorage.removeItem(AKEY);localStorage.removeItem(LKEY)}catch(e){}
    folderFiles=[];$('tw-list').innerHTML='';$('tw-list-row').hidden=true;
    markCustom();
    // aplikacja tez musi zapomniec wybrane pliki, inaczej dalej gralaby po sciezce
    if(window.__native){
      pickPending=true;chan('__RESET__');
      setTimeout(function(){pickPending=false;paint(mode==='idle'?total*1000:(endAt-Date.now()))},600);
    }
  });
  $('tw-font').addEventListener('change',function(){
    fontPref=this.value;save();applyFont();
  });
  $('tw-theme').addEventListener('change',function(){
    themePref=this.value;save();applyTheme();paint(mode==='idle'?total*1000:(endAt-Date.now()));
  });
  if(window.matchMedia){
    try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){
      if(themePref==='auto'){applyTheme();paint(mode==='idle'?total*1000:(endAt-Date.now()))}
    })}catch(e){}
  }
  function fitDial(){
    var root=document.querySelector('.tw'),right=document.querySelector('.tw-right'),left=document.querySelector('.tw-left');
    if(window.matchMedia('(min-width:820px) and (min-height:560px)').matches){
      var titleH=document.querySelector('.tw-title').offsetHeight;
      var gap=parseFloat(getComputedStyle(left).rowGap)||16;
      var target=right.offsetHeight-titleH-gap;
      var max=Math.min(window.innerHeight-120,window.innerWidth*0.42,560);
      root.style.setProperty('--dial',Math.max(240,Math.min(target,max))+'px');
    }else{
      root.style.removeProperty('--dial');
    }
  }
  window.addEventListener('resize',fitDial);

  // po wyborze z listy ognisko ma odejsc razem z menu
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t&&t.tagName==='SELECT'&&typeof t.blur==='function')t.blur();
  });

  // Lista rozwijana trzyma ognisko po kliknieciu i obwodka zostaje nawet
  // wtedy, gdy mysz poszla gdzie indziej. Klikniecie poza kontrolke ma je
  // oddawac - obwodka nalezy sie klawiaturze, nie myszy.
  document.addEventListener('mousedown',function(e){
    var a=document.activeElement;
    if(!a||a===document.body)return;
    if(a===e.target||a.contains(e.target))return;
    if(typeof a.blur==='function')a.blur();
  },true);

  // --- most do aplikacji macOS (WKWebView nie obsluguje <input type=file>) ---
  // Kanal do aplikacji. Tytul zostaje (widac go w przegladarce), ale
  // aplikacji nie kaze sie juz o niego dopytywac: WKWebView sam ja wola.
  // Wysylka tylko przy faktycznej zmianie - paint() chodzi 10 razy na
  // sekunde, a stan zmienia sie najwyzej raz.
  var lastChan='';
  function chan(t){
    if(t===lastChan)return;
    lastChan=t;
    document.title=t;
    try{
      var h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.timer;
      if(h)h.postMessage(t);
    }catch(e){}
  }
  window.__native=/ProstyTimerApp/.test(navigator.userAgent);
  window.__nativeMode=function(){window.__native=true};
  // tlo okna rysuje aplikacja (NSGlassEffectView) - strona ma zejsc z drogi
  window.__glass=function(on,tint){
    document.documentElement.setAttribute('data-glass',on?'1':'0');
    // suwak szkla z macOS 27, w setnych calkowitych: 0 przejrzyste, 100 zabarwione
    if(typeof tint==='number'&&isFinite(tint)){
      document.documentElement.style.setProperty('--tint',Math.max(0,Math.min(1,tint/100)));
    }
    if(typeof fitDial==='function')setTimeout(fitDial,0);
  };
  // sygnał dla aplikacji: podmiana tytułu, którą skrypt wykrywa
  window.__askFiles=function(){
    chan('__PICK__');
  };
  $('tw-hint').addEventListener('click',function(){
    pickPending=true;
    chan('__PICK__');
    setTimeout(function(){pickPending=false},4000);
  });
  // tytul musi wrocic ze znacznikami (|L...), inaczej pasek menu wezmie go za czas
  window.__pickDone=function(){pickPending=false;paint(mode==='idle'?total*1000:(endAt-Date.now()))};
  window.__cmd=function(c){
    try{
      if(typeof c==='number'){setInputs(c);total=c;paint(total*1000);$('tw-main').click();return}
      if(c==='main')$('tw-main').click();
      else if(c==='reset')$('tw-reset').click();
      else if(c==='mute')$('tw-mute').click();
    }catch(e){}
  };
  // kolejnosc listy ustala aplikacja - strona jej nie zmienia,
  // inaczej indeks |S w tytule wskazywalby inny plik niz gra skrypt
  window.__loadAlarms=function(list,skipSave){
    try{
      if(!list||!list.length)return;
      if(!skipSave){
        try{localStorage.setItem(LKEY,JSON.stringify(list))}catch(e){}
      }
      // w aplikacji dzwiek gra skrypt (z pliku), stronie wystarczaja same nazwy
      if(window.__native||!list[0].data){
        folderFiles=list.map(function(it){return {name:it.name,buf:null,native:true}});
        finish();
        return;
      }
      var out=new Array(list.length),pending=list.length;
      list.forEach(function(it,i){
        var bin=atob(it.data),len=bin.length,arr=new Uint8Array(len);
        for(var k=0;k<len;k++)arr[k]=bin.charCodeAt(k);
        ctx().decodeAudioData(arr.buffer,function(dec){
          out[i]={name:it.name,buf:dec};
          if(--pending===0){folderFiles=out.filter(function(f){return f});finish()}
        },function(){if(--pending===0){folderFiles=out.filter(function(f){return f});finish()}});
      });
      function finish(){
        if(!folderFiles.length)return;
        buildList();
        $('tw-list').selectedIndex=0;
        customBuf=folderFiles[0].buf;customName=folderFiles[0].name;markCustom();
      }
    }catch(e){}
  };
  // wykrycie aplikacji: WKWebView nie ma "Safari" w identyfikatorze
  load();applyTheme();applyFont();buildLangList();applyLang();setInputs(total);paint(total*1000);
  loadStored();markCustom();
  // lista dźwięków wraca z aplikacji (window.__loadAlarms), jeśli plik zapisu istnieje
  fitDial();setTimeout(fitDial,60);
})();
</script>
</body>
</html>
